<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Atlas — Focus Reader</title><link rel="stylesheet" href="tailwind.css"><style>
:root{--ink:#172d35;--paper:#f5f4ee;--green:#d9e8d6;--accent:#d85936;--line:#d9ded7}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:'Yu Gothic',Meiryo,sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ed784f;outline-offset:4px}.skip{position:absolute;top:-80px;left:20px;padding:12px;background:white;z-index:100}.skip:focus{top:10px}header{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--line);background:#faf9f5}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand em{font-style:normal;color:var(--accent)}.edition{font:11px monospace;letter-spacing:.14em}.top-right{display:flex;gap:22px;align-items:center}.tag{font-size:11px;border:1px solid var(--line);padding:8px 12px;border-radius:20px}.shell{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 82px)}aside{padding:28px 20px;border-right:1px solid var(--line);background:#eeeee7}.eyebrow{font:11px monospace;letter-spacing:.14em;color:#64766f}.search-label{display:block;font-size:11px;margin:24px 0 8px}.search{width:100%;padding:14px 16px;border:1px solid #cdd6ce;border-radius:8px;background:#fbfcf8;color:var(--ink)}.nav-list{display:grid;gap:7px;margin-top:20px}.fact-link{display:flex;align-items:center;text-align:left;gap:14px;width:100%;padding:17px 12px;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:9px;transition:background .15s}.fact-link:hover{background:#e1e7dc}.fact-link[aria-current=true]{background:var(--ink);color:white;box-shadow:0 6px 14px #142c3520}.fact-link small{display:block;font-size:10px;opacity:.65;margin-top:4px}.num{font:12px monospace;opacity:.7}.fact-title{font-size:13px;line-height:1.6;font-weight:700}.arrow{margin-left:auto}.aside-note{margin:30px 12px 0;font-size:11px;line-height:1.9;color:#6c7c73}#empty{padding:20px 12px;font-size:13px}.reading{padding:38px 5vw 30px;max-width:1280px;width:100%;margin:auto}.reader-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:18px}.chapter{font-size:12px;color:var(--accent);font-weight:bold}.progress{display:flex;gap:6px}.progress span{height:4px;width:25px;background:#d6ddd2;border-radius:4px}.progress .on{background:var(--accent)}.article-top{display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:center;padding:38px 0 30px}.kicker{font:12px monospace;color:#758378;letter-spacing:.1em;margin-bottom:20px}h1{font-size:clamp(26px,3vw,46px);line-height:1.5;letter-spacing:-.05em;margin:0 0 22px}#lead{font-size:14px;line-height:2.1;color:#4c625d;max-width:480px}.illustration{height:330px;position:relative;background:var(--green);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.illustration:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#54706412 1px,transparent 1px),linear-gradient(90deg,#54706412 1px,transparent 1px);background-size:28px 28px}.visual-label{position:absolute;left:22px;top:20px;font:10px monospace;letter-spacing:.12em;z-index:2}.visual-bottom{position:absolute;left:22px;bottom:18px;font:10px monospace;letter-spacing:.08em}.art{position:relative;z-index:1;width:100%;padding:30px;text-align:center}.big-stat{font-size:clamp(48px,5.6vw,86px);letter-spacing:-.06em;font-weight:900;white-space:nowrap}.big-stat small{font-size:32px}.stat-caption{font-size:12px;margin-top:10px}.mini-dots{display:grid;grid-template-columns:repeat(10,9px);gap:6px;justify-content:center;margin:22px 0}.mini-dots i{width:9px;height:9px;border-radius:50%;background:var(--ink)}.mini-dots i:last-child{background:#a9b7a4}.body-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;padding-top:24px;border-top:1px solid var(--line)}.body-grid h2{font-size:14px;margin:0 0 13px}.body-grid p{font-size:13px;line-height:2;margin:0;color:#50655c}.insight{padding:20px 23px;background:#e9eadd;border-left:3px solid var(--accent);border-radius:0 8px 8px 0}.insight h2{font-size:11px;letter-spacing:.06em;color:#7a533d}.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:22px;border-top:1px solid var(--line)}.nav-button{padding:12px 18px;background:transparent;border:1px solid #c8d2c7;color:var(--ink);border-radius:7px;font-size:12px}.nav-button.next{background:var(--ink);color:white;border-color:var(--ink)}.nav-button:disabled{opacity:.35;cursor:default}.counter{font:11px monospace;color:#738173}.code{background:var(--ink);color:#e8f1de;border-radius:9px;padding:20px;text-align:left;font:13px/2 monospace;box-shadow:10px 13px 0 #b5c8ae;transform:rotate(-3deg)}.code b{color:#f4ac7b}.orbit{width:180px;height:180px;border:1px dashed #6c8d73;border-radius:50%;margin:auto;position:relative}.orbit:after{content:'✦';position:absolute;top:0;right:20px;color:var(--accent);font-size:28px}.planet{position:absolute;inset:30px;border-radius:50%;background:#b96542;box-shadow:inset -20px -15px 0 #8b452c;display:flex;align-items:center;justify-content:center;color:#ffdec5;font-size:55px}.phone{width:106px;height:170px;background:var(--ink);border-radius:18px;padding:8px;margin:auto;box-shadow:13px 14px 0 #b4c7ac;transform:rotate(8deg)}.phone-screen{height:100%;border-radius:12px;background:#91b383;display:flex;flex-direction:column;justify-content:center;align-items:center;color:var(--ink);font:bold 21px monospace}.phone-screen span{font-size:11px;margin-top:10px}.article-enter{animation:enter .28s ease-out}@keyframes enter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}#motion{background:none;border:0;font-size:11px;color:#64766f;text-decoration:underline;padding:6px}.no-motion .article-enter{animation:none}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1100px){.shell{grid-template-columns:280px 1fr}.reading{padding:30px}.article-top{gap:20px}.illustration{height:290px}.big-stat{font-size:56px}.edition{display:none}}@media(max-width:800px){header{padding:0 20px}.tag{display:none}.shell{display:block}aside{padding:20px;border-right:0;border-bottom:1px solid var(--line)}.search-label{margin-top:14px}.nav-list{grid-template-columns:repeat(2,minmax(0,1fr))}.fact-link{padding:10px;gap:8px}.aside-note{display:none}.reading{padding:25px 20px}.article-top{grid-template-columns:1fr}.illustration{height:280px}.body-grid{grid-template-columns:1fr}h1{font-size:34px}.big-stat{font-size:76px}}@media(max-width:420px){.fact-title{font-size:11px}.arrow{display:none}.brand{font-size:21px}.top-right{gap:5px}.reader-meta{align-items:flex-start}.progress span{width:15px}}
</style></head><body class="antialiased"><a class="skip" href="#article">本文へスキップ</a><header><div class="brand">GIT ATLAS<em>.</em></div><span class="edition">A FIELD GUIDE TO THE WORLD OF GIT</span><div class="top-right"><span class="tag">06 / FOCUS READER</span><button id="motion" aria-pressed="false">動きをオフ</button></div></header><div class="shell"><aside aria-label="記事を選ぶ"><div class="eyebrow">THE COLLECTION / 6 DISCOVERIES</div><label class="search-label" for="search">読みたいテーマを探す</label><input class="search" id="search" type="search" placeholder="例：宇宙、Android、歴史" autocomplete="off"><nav class="nav-list" id="nav" aria-label="発見の目次"></nav><p id="empty" hidden>見つかりませんでした。<br>別の言葉で探してみてください。</p><p class="aside-note">気になった項目から、自由に。<br>小さな発見が、次の一歩になる。</p></aside><main class="reading" id="article" tabindex="-1"><div class="reader-meta"><span id="chapter" class="chapter"></span><div class="progress" aria-hidden="true"></div></div><div id="content"></div><div class="bottom-nav"><button class="nav-button" id="prev">← 前の発見</button><span class="counter" id="counter" aria-live="polite"></span><button class="nav-button next" id="next">次の発見 →</button></div></main></div><noscript><p style="padding:30px">この比較プロトタイプの記事切替にはJavaScriptが必要です。</p></noscript><script>
'use strict';
const facts=[
{title:'世界とつながる、最初の道具。',nav:'世界で使われるGit',chapter:'01 / 世界の規模',date:'2022 / DEVELOPER SURVEY',keywords:'規模 世界 調査',lead:'チーム開発を学ぶ最初の一歩は、世界中の開発者が使う道具を知ることから。Gitは、その共通言語のひとつです。',body:'2022年のStack Overflow調査では、プロの開発者として回答した人の96.65%がGitを利用していました。授業で覚える操作は、その先の開発現場にもつながっています。',note:'世界の全開発者を数えた割合ではなく、調査に回答したプロ開発者の割合です。',art:'<div class="big-stat">96.65<small>%</small></div><div class="mini-dots">'+ '<i></i>'.repeat(30)+'</div><div class="stat-caption">プロ開発者の回答者がGitを利用</div>'},
{title:'日本からも、世界の開発へ。',nav:'日本のコミュニティ',chapter:'01 / 世界の規模',date:'2025 / JAPAN',keywords:'日本 規模 世界',lead:'世界の開発は、遠い国だけの話ではありません。あなたのすぐそばにも、大きなコミュニティがあります。',body:'2025年版の発表では、日本のGitHub開発者コミュニティは450万人を超え、国・地域別で世界6位。個人の学習からチームの開発まで、参加の入口はさまざまです。',note:'GitHubの開発者コミュニティの集計です。世界の全プログラマー人口の順位ではありません。',art:'<div class="big-stat">450<small>万人+</small></div><div class="stat-caption">日本の開発者コミュニティ / 2025</div><div style="margin-top:28px;font-size:24px">WORLD RANK <b>06</b></div>'},
{title:'そのスマートフォンの、裏側にも。',nav:'AndroidとGit',chapter:'02 / 身近な製品',date:'ANDROID / OPEN SOURCE',keywords:'Android スマホ 製品 Repo',lead:'毎日触れる製品も、たくさんの人がコードを少しずつ更新することでつくられています。',body:'Androidのオープンソース開発ではGitとRepoが使われています。Repoは複数のGitリポジトリをまとめて扱う道具。大きな製品では、多くのリポジトリが協力して動きます。',note:'Android Open Source Projectのソース管理の話です。GitとGitHubは別のものです。',art:'<div class="phone"><div class="phone-screen">Android<span>Git + Repo</span></div></div><div class="stat-caption" style="margin-top:26px">身近な製品を支える、変更の記録。</div>'},
{title:'コードを書く道具も、公開開発。',nav:'VS Codeの裏側',chapter:'02 / 身近な製品',date:'CODE - OSS / COMMUNITY',keywords:'VS Code エディター 製品',lead:'これから使うエディターも、誰かが書いたコードからできています。その開発過程を、のぞいてみませんか。',body:'VS Codeの基盤となるCode - OSSは、MicrosoftのGitHubリポジトリでコミュニティと公開開発されています。ソースやIssueから、普段の道具をつくる過程に触れられます。',note:'配布版VS Codeや、すべての拡張機能まで同じライセンスという意味ではありません。',art:'<div class="code"><span style="opacity:.5">● ● ●  editor.js</span><br><b>const</b> curiosity = true;<br><b>function</b> explore() {<br>  return "Hello, Code!";<br>}<br><span style="color:#91b383">// built together</span></div>'},
{title:'小さな原型が、世界の道具に。',nav:'約10日から始まったGit',chapter:'03 / Gitの歴史',date:'2005 / THE BEGINNING',keywords:'歴史 10日 誕生 Linux',lead:'大きな技術にも、最初の一歩があります。Gitも、具体的な困りごとを解決するために生まれました。',body:'2005年、Linuxの開発を支えるためにLinus TorvaldsがGitの初期コアを制作しました。本人の振り返りによると、その原型にかけた時間は約10日でした。',note:'現在のGitの全機能が10日で完成した、という意味ではありません。初期コアの制作期間です。',art:'<div style="font:13px monospace;letter-spacing:.2em">THE FIRST CORE</div><div class="big-stat" style="margin-top:20px">約10<small>日</small></div><div class="stat-caption">2005 → 小さな始まり、大きな歴史。</div>'},
{title:'あなたの貢献が、火星を飛ぶかも。',nav:'火星とオープンソース',chapter:'04 / 北極と宇宙',date:'2021 / INGENUITY',keywords:'宇宙 火星 NASA OSS',lead:'ひとつの変更が、思いがけない場所で役立つ。オープンソースには、そんな広がりがあります。',body:'火星ヘリコプターIngenuityが利用したオープンソースソフトウェアには、約1万2,000人の開発者が貢献していました。日々の小さな仕事が、遠い惑星への挑戦を支えています。',note:'利用されたOSSへの貢献者数です。NASAが直接雇用した開発者の人数ではありません。',art:'<div class="orbit"><div class="planet">✦</div></div><div class="stat-caption" style="margin-top:24px">約12,000人の貢献が、火星の空へ。</div>'}
];
let active=0;const nav=document.querySelector('#nav'),content=document.querySelector('#content'),search=document.querySelector('#search');
function drawNav(){const q=search.value.trim().toLowerCase();nav.replaceChildren();facts.forEach((f,i)=>{if(!(f.nav+f.keywords+f.title).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='fact-link';b.type='button';b.setAttribute('aria-current',String(i===active));b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span class="fact-title">${f.nav}<small>${f.chapter.slice(5)}</small></span><span class="arrow" aria-hidden="true">↗</span>`;b.addEventListener('click',()=>show(i));nav.append(b)});document.querySelector('#empty').hidden=nav.children.length!==0}
function show(i){active=i;const f=facts[i];document.querySelector('#chapter').textContent=f.chapter;content.innerHTML=`<div class="article-top article-enter"><div><div class="kicker">${f.date}</div><h1>${f.title}</h1><p id="lead">${f.lead}</p></div><div class="illustration" aria-hidden="true"><span class="visual-label">FIELD NOTE / ${String(i+1).padStart(2,'0')}</span><div class="art">${f.art}</div><span class="visual-bottom">SMALL CHANGES. BIG POSSIBILITIES.</span></div></div><div class="body-grid"><section><h2>この発見を、もう少し。</h2><p>${f.body}</p></section><section class="insight"><h2>数字・表現の読み方</h2><p>${f.note}</p></section></div>`;document.querySelector('#counter').textContent=`${String(i+1).padStart(2,'0')} / 06`;document.querySelector('.progress').innerHTML=facts.map((_,j)=>`<span class="${j<=i?'on':''}"></span>`).join('');document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===facts.length-1;drawNav()}
search.addEventListener('input',drawNav);document.querySelector('#prev').addEventListener('click',()=>{if(active>0)show(active-1)});document.querySelector('#next').addEventListener('click',()=>{if(active<facts.length-1)show(active+1)});let off=window.matchMedia('(prefers-reduced-motion:reduce)').matches;const motion=document.querySelector('#motion');function setMotion(){document.body.classList.toggle('no-motion',off);motion.setAttribute('aria-pressed',String(off));motion.textContent=off?'動きをオン':'動きをオフ'}motion.addEventListener('click',()=>{off=!off;setMotion()});setMotion();show(0);
</script></body></html>
