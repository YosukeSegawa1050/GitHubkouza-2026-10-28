(780px,calc(100% - 40px));max-height:90vh;overflow:auto;box-shadow:0 20px 100px #0005}dialog::backdrop{background:#172b28b8;backdrop-filter:blur(5px)}.detail{padding:48px 55px}.close{position:absolute;right:18px;top:14px;background:transparent;border:1px solid #9ba58c;border-radius:30px;padding:7px 12px;font-size:12px;cursor:pointer}.detail-label{font-size:11px;letter-spacing:.14em;color:var(--orange)}.detail h2{font-size:33px;line-height:1.5;margin:20px 0}.detail .visual{background:var(--green);padding:25px;text-align:center;margin:25px 0}.detail .visual strong{font:italic 64px Georgia,serif}.detail .visual span{display:block;font-size:12px;margin-top:5px}.detail p{font-size:15px;line-height:2.15}.qualifier{border-left:3px solid #cd8d43;padding-left:18px;font-size:12px!important;color:#687264}.detail-nav{display:flex;justify-content:space-between;gap:10px;margin-top:25px}.detail-nav button{border:1px solid #6c7c65;background:transparent;padding:10px 14px;cursor:pointer;border-radius:3px}.detail-nav button:disabled{opacity:.35;cursor:default}.motion-off *{transition:none!important;scroll-behavior:auto!important}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}@media(max-width:950px){main{padding:25px 30px 40px}header{padding:25px 30px 0}.desk{gap:30px 24px;grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:start}.intro-copy{max-width:260px}.note{min-height:330px}}@media(max-width:600px){header{padding:20px}.top-note{display:none}main{padding:20px 25px 40px}.intro{display:block;padding:0 0 20px}.intro-copy{max-width:none;margin-top:22px}.desk{grid-template-columns:1fr;gap:34px}.note{min-height:320px}.detail{padding:45px 24px 25px}.detail h2{font-size:26px}.detail .visual strong{font-size:51px}footer{flex-direction:column}.edition{padding:8px 12px}}
</style></head><body class="antialiased"><a href="#main" class="skip">本文へスキップ</a><header><a class="brand" href="index.html">GIT <b>ATELIER.</b></a><span class="top-note">POSSE 7.5 / SIX LITTLE DISCOVERIES</span><span class="edition">WORKSHOP<br>NO. 13</span></header><main id="main"><section class="intro"><div><p class="kicker">Good things begin with curiosity.</p><h1>Gitの世界を、<br><em>作業机にひろげよう。</em></h1></div><p class="intro-copy">いつもの道具から、遠い火星まで。<br>気になるメモをひとつ、手に取ってみよう。<span class="scribble">Pick a note. Find a story. ↙</span></p></section><section class="desk" aria-label="6つの発見">
<button class="note" style="--angle:-2deg" data-id="0" aria-haspopup="dialog"><span class="meta"><span>01 / WORLD</span><span>2022年調査</span></span><h2>最初の一歩は、<br>世界と同じ道具。</h2><div class="art"><span class="big">96.65<small>%</small></span></div><p>プロ開発者として調査に答えた人のうち、<br>Gitを利用していた人の割合。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
<button class="note mint" style="--angle:1.5deg" data-id="1" aria-haspopup="dialog"><span class="meta"><span>02 / JAPAN</span><span>2025年版</span></span><h2>すぐ隣にも、<br>たくさんの仲間。</h2><div class="art"><svg viewBox="0 0 300 120" aria-hidden="true"><path d="M227 13l-12 17 7 9-15 13-8-1-11 15-16 5-7 12-18 4-10 13-25-1-7 9-14-8 17-15 23-5 15-13 22-4 12-13 17-8 9-16z" fill="#416452"/><path d="M214 7l10-6 15 7 7 16-13 6-15-9zM87 100l-18 2-7 11 17 4 12-7z" fill="#416452"/><text x="15" y="50" font-family="Georgia" font-style="italic" font-size="44" fill="#29483b">4.5M+</text><text x="17" y="76" font-size="12" fill="#29483b">developers in Japan</text><path d="M20 87q52 8 105-3" fill="none" stroke="#b56c38" stroke-width="2"/></svg></div><p>日本のGitHub開発者コミュニティは<br>450万人超。国・地域別で世界6位。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
<button class="note blue" style="--angle:-1deg" data-id="2" aria-haspopup="dialog"><span class="meta"><span>03 / EVERYDAY</span><span>Android</span></span><h2>ポケットの中にも、<br>Gitの仕事。</h2><div class="art"><svg viewBox="0 0 300 120" aria-hidden="true"><rect x="115" y="3" width="70" height="110" rx="12" fill="#fcf8e9" stroke="#385956" stroke-width="3"/><rect x="122" y="20" width="56" height="70" rx="4" fill="#9db69a"/><path d="M137 42q13-17 26 0v15h-26zM138 36l-5-8M161 36l5-8" fill="#f6f6e8" stroke="#f6f6e8" stroke-width="3"/><circle cx="143" cy="44" r="2" fill="#385956"/><circle cx="157" cy="44" r="2" fill="#385956"/><circle cx="150" cy="102" r="4" fill="#385956"/><text x="32" y="52" font-size="19" font-family="Georgia" fill="#385956">Git</text><text x="221" y="79" font-size="19" font-family="Georgia" fill="#385956">Repo</text><path d="M63 51h35m-7-5 7 5-7 5M205 77h-15m7-5-7 5 7 5" fill="none" stroke="#b06d46" stroke-width="2"/></svg></div><p>Androidのオープンソース開発では、<br>GitとRepoが活躍しています。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
<button class="note dark" style="--angle:1deg" data-id="3" aria-haspopup="dialog"><span class="meta"><span>04 / YOUR TOOLS</span><span>Code - OSS</span></span><h2>コードを書く道具も、<br>みんなで育てる。</h2><div class="art"><svg viewBox="0 0 300 120" aria-hidden="true"><rect x="22" y="7" width="256" height="102" rx="6" fill="#19332e" stroke="#a7bfa6"/><path d="M22 29h256M75 29v80" stroke="#a7bfa6" opacity=".5"/><circle cx="35" cy="18" r="3" fill="#e6bc7a"/><circle cx="46" cy="18" r="3" fill="#a7bfa6"/><text x="91" y="63" font-size="22" font-family="monospace" fill="#d7e9c6">&lt;hello, world&gt;</text><path d="M92 78h105M92 90h65M34 45h25M34 56h17M34 67h22" stroke="#8ba88c" stroke-width="3"/></svg></div><p>VS Codeの基盤「Code - OSS」は、<br>GitHubでコミュニティと公開開発。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
<button class="note lined" style="--angle:-1.8deg" data-id="4" aria-haspopup="dialog"><span class="meta"><span>05 / HISTORY</span><span>2005年</span></span><h2>大きな歴史の、<br>小さな始まり。</h2><span class="stamp" aria-hidden="true">ORIGIN</span><div class="art"><span class="big">10<small> days</small></span></div><p>Gitの初期コアが生まれるまで、約10日。<br>その原型から、いまの道具へ。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
<button class="note peach" style="--angle:2deg" data-id="5" aria-haspopup="dialog"><span class="meta"><span>06 / BEYOND</span><span>2021年の紹介</span></span><h2>小さな貢献は、<br>火星にも届く。</h2><div class="art"><svg viewBox="0 0 300 120" aria-hidden="true"><circle cx="238" cy="30" r="18" fill="#d98c61"/><path d="M12 109q65-20 123-5t153 3" fill="none" stroke="#b66b4b" stroke-width="2"/><path d="M130 54h42v23h-42zM150 22v31M94 22h114M107 37h87M140 77l-15 24M164 77l15 24M113 101h20M171 101h20" fill="#744f3d" stroke="#744f3d" stroke-width="3"/><path d="M139 60h25v8h-25z" fill="#eec89e"/><text x="20" y="48" font-size="20" font-family="Georgia" font-style="italic" fill="#744f3d">Hello,</text><text x="24" y="72" font-size="26" font-family="Georgia" font-style="italic" fill="#744f3d">Mars!</text></svg></div><p>Ingenuityが利用したOSSには、<br>約1万2,000人の開発者が貢献。</p><span class="open">メモをひらく<span aria-hidden="true">↗</span></span></button>
</section><footer><span>一部制作版 / 6つの発見<br>数値は記載年・対象のものです。GitとGitHubは異なります。</span><button id="motion" aria-pressed="false">動きをオフにする</button><span>13 — WORKSHOP DESK<br>手に取るように、知っていく。</span></footer></main>
<dialog id="story" aria-labelledby="detail-title"><button class="close" id="close">閉じる ×</button><article class="detail"><div class="detail-label" id="detail-label"></div><h2 id="detail-title"></h2><div class="visual"><strong id="detail-stat"></strong><span id="detail-unit"></span></div><p id="detail-body"></p><p class="qualifier" id="detail-note"></p><nav class="detail-nav" aria-label="記事を移動"><button id="prev">← 前のメモ</button><button id="next">次のメモ →</button></nav></article></dialog>
<script>
(()=>{'use strict';const facts=[
['01 / WORLD · 2022年調査','最初の一歩は、世界と同じ道具。','96.65%','調査のプロ開発者回答者のGit利用率','2022年のStack Overflow調査では、プロの開発者として回答した人の96.65%がGitを利用していました。これから練習する変更履歴の管理は、世界の開発現場でも使われる仕組みです。','世界の全開発者を数えた割合ではなく、この調査に回答したプロ開発者の割合です。'],
['02 / JAPAN · 2025年版','すぐ隣にも、たくさんの仲間。','4.5M+','日本のGitHub開発者コミュニティ','2025年版の発表では、日本のGitHub開発者コミュニティは450万人を超え、国・地域別で世界6位でした。世界の開発に参加することは、遠い国だけの話ではありません。','2025年版の集計です。世界の全プログラマー人口の順位を示すものではありません。'],
['03 / EVERYDAY · Android','ポケットの中にも、Gitの仕事。','Git + Repo','Android Open Source Project','Androidのオープンソース開発ではGitとRepoが使われています。Repoは、複数のGitリポジトリをまとめて扱うための道具です。大きな製品の裏側でも、変更の記録と共同作業が積み重なっています。','Android Open Source Projectのソース管理についての話です。Gitを使うことと、GitHub上で開発することは別です。'],
['04 / YOUR TOOLS · Code - OSS','コードを書く道具も、みんなで育てる。','Code - OSS','VS Codeの基盤となるオープンソース','VS Codeの基盤となるCode - OSSは、MicrosoftのGitHubリポジトリでコミュニティと公開開発されています。ソースやIssueを読むと、普段使うエディターが育っていく過程をのぞけます。','配布版VS Codeや、すべての拡張機能まで同じライセンスという意味ではありません。'],
['05 / HISTORY · 2005年','大きな歴史の、小さな始まり。','約10日','Gitの初期コアの制作期間','2005年、Linus TorvaldsはLinuxの開発を支えるためにGitを制作しました。本人の振り返りによると、初期コアにかけた時間は約10日。その原型から、長い改良の歴史が始まっています。','現在のGitの全機能が10日で完成した、という意味ではありません。'],
['06 / BEYOND · 2021年の紹介','小さな貢献は、火星にも届く。','約12,000人','Ingenuityが利用したOSSへの貢献者','火星ヘリコプターIngenuityが利用したオープンソースソフトウェアには、約1万2,000人の開発者が貢献していました。身近なコードへのひとつの貢献が、思いがけない場所で役立つこともあります。','利用されたOSSへの貢献者です。NASAが直接雇用した開発者数ではありません。']];
const dialog=document.querySelector('#story');let current=0,opener=null;const keys=['label','title','stat','unit','body','note'];function render(){facts[current].forEach((value,i)=>document.querySelector('#detail-'+keys[i]).textContent=value);document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===facts.length-1;dialog.scrollTop=0;}document.querySelectorAll('[data-id]').forEach(button=>button.addEventListener('click',()=>{opener=button;current=Number(button.dataset.id);render();dialog.showModal();document.querySelector('#close').focus();}));document.querySelector('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>opener?.focus());document.querySelector('#prev').addEventListener('click',()=>{if(current>0){current--;render();if(current===0)document.querySelector('#next').focus();}});document.querySelector('#next').addEventListener('click',()=>{if(current<facts.length-1){current++;render();if(current===facts.length-1)document.querySelector('#prev').focus();}});const motion=document.querySelector('#motion'),media=matchMedia('(prefers-reduced-motion: reduce)');function setMotion(off){document.body.classList.toggle('motion-off',off);motion.setAttribute('aria-pressed',String(off));motion.textContent=off?'動きをオンにする':'動きをオフにする';}setMotion(media.matches);motion.addEventListener('click',()=>setMotion(motion.getAttribute('aria-pressed')!=='true'));media.addEventListener('change',e=>setMotion(e.matches));})();
</script></body></html>
