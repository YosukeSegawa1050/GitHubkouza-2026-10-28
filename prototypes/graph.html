<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Atlas — 枝をたどる</title><link rel="stylesheet" href="tailwind.css"><style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#141d2b;--line:#273347;--text:#eaf1f8;--muted:#9aaabd;--mint:#9de6bd;--blue:#8cbbff;--orange:#f5b483}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic",Meiryo,system-ui,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:5px}button{color:inherit}header{max-width:1440px;margin:auto;padding:30px 42px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:20px;letter-spacing:.07em;text-decoration:none}.brand span{color:var(--mint)}.eyebrow{font:11px ui-monospace,Consolas,monospace;letter-spacing:.15em;color:var(--muted)}.badge{font:11px ui-monospace,monospace;border:1px solid var(--line);padding:9px 13px;border-radius:30px;color:var(--mint)}.intro{max-width:1440px;margin:0 auto;padding:40px 42px 32px;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:clamp(26px,3.3vw,44px);margin:12px 0 0;letter-spacing:-.04em}.intro p{font-size:13px;line-height:1.9;color:var(--muted);margin:0;max-width:440px}.workspace{max-width:1440px;padding:0 42px 48px;margin:auto;display:grid;grid-template-columns:minmax(360px,.9fr) minmax(440px,1.15fr);gap:24px}.graph-panel{border:1px solid var(--line);background:#101825;border-radius:18px;overflow:hidden}.panel-top{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:var(--muted)}.panel-top strong{color:var(--text);font-weight:500}.graph{height:524px;position:relative;margin:6px 0}.lines{position:absolute;inset:0;width:140px;height:100%;pointer-events:none}.rail{fill:none;stroke-width:3;opacity:.23;transition:opacity .3s}.rail.on{opacity:1}.nodes{margin:0;padding:17px 20px;list-style:none;position:relative;display:grid;gap:10px}.node{position:relative;display:flex;align-items:center;gap:15px;width:100%;height:72px;padding:8px 14px 8px 120px;border:1px solid transparent;background:transparent;text-align:left;border-radius:11px}.node:hover{background:#1b2737}.node[aria-current=true]{background:#203448;border-color:#38546b}.node .dot{position:absolute;left:33px;top:24px;width:22px;height:22px;border:4px solid var(--mint);background:#101825;border-radius:50%;box-shadow:0 0 0 6px #101825}.node[data-branch=products] .dot{left:78px;border-color:var(--blue)}.node[data-branch=space] .dot{border-color:var(--orange)}.node[aria-current=true] .dot{background:currentColor}.node-title{font-weight:700;font-size:14px;display:block;margin-top:7px}.node-meta{font:10px ui-monospace,monospace;color:var(--muted)}.node-tag{margin-left:auto;font:10px ui-monospace,monospace;color:var(--mint)}.graph-note{font-size:11px;line-height:1.8;padding:16px 24px;border-top:1px solid var(--line);color:var(--muted);margin:0}.detail{position:relative;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#182332,#111925);padding:30px 34px;min-height:650px;overflow:hidden;display:flex;flex-direction:column}.detail:before{content:"";position:absolute;width:320px;height:320px;top:25px;right:-160px;background:radial-gradient(circle,#254b43,transparent 70%);pointer-events:none}.detail-meta{display:flex;justify-content:space-between;align-items:center;position:relative}.pill{font:10px ui-monospace,monospace;color:var(--mint);letter-spacing:.08em;background:#20372f;border:1px solid #345647;padding:8px 10px;border-radius:6px}.sequence{font:11px ui-monospace,monospace;color:var(--muted)}.detail h2{font-size:clamp(23px,2.5vw,35px);line-height:1.5;letter-spacing:-.035em;margin:24px 0 20px;max-width:95%}.visual{height:170px;border:1px solid #2e4152;border-radius:12px;background:#0e1722;position:relative;overflow:hidden;padding:20px 23px;display:flex;align-items:center;gap:15px}.visual svg{width:145px;height:135px;flex-shrink:0}.metric{font:700 clamp(35px,4.8vw,65px) ui-monospace,monospace;letter-spacing:-.06em;color:var(--mint);white-space:nowrap}.metric-label{font-size:11px;line-height:1.6;color:var(--muted);margin-top:6px}.copy{font-size:14px;line-height:2.05;color:#c7d2de;margin:22px 0 16px}.qualifier{border-left:2px solid #637a8b;color:var(--muted);font-size:11px;line-height:1.9;padding:3px 0 3px 13px;margin:0 0 26px}.detail-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:20px;border-top:1px solid var(--line)}.step{border:1px solid #3c5268;border-radius:8px;background:#233449;font-size:12px;padding:12px 16px}.step:hover{background:#314a62}.step:disabled{opacity:.35;cursor:default}.motion{font-size:10px;background:none;border:0;text-decoration:underline;text-underline-offset:4px;color:var(--muted)}.skip{position:absolute;top:-100px;left:10px;background:white;color:black;padding:10px;z-index:20}.skip:focus{top:10px}.detail.animate .visual{animation:appear .3s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}body.motion-off *,body.motion-off *:before{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:1050px){.workspace{padding:0 24px 32px;grid-template-columns:minmax(320px,.9fr) minmax(370px,1fr);gap:16px}.detail{padding:25px}.visual{padding:15px}.visual svg{width:100px}.intro,header{padding-left:24px;padding-right:24px}.node{padding-left:105px}.node-tag{display:none}}@media(max-width:780px){.workspace{display:block}.graph-panel{margin-bottom:20px}.graph{height:auto}.lines{display:none}.nodes{grid-template-columns:1fr 1fr;gap:7px;padding:12px}.node{height:80px;padding:12px}.node .dot{display:none}.graph-note{padding:12px 18px}.intro{display:block}.intro p{margin-top:18px}.detail{min-height:610px}.detail h2{font-size:26px}.intro .eyebrow{font-size:10px}.badge{font-size:9px;padding:8px}.visual svg{widt </style></head><body class="antialiased"><a class="skip" href="#detail">記事へスキップ</a><header><a class="brand" href="index.html">GIT<span> / </span>ATLAS</a><span class="badge">PROTOTYPE 16 · BRANCH EXPLORER</span></header><section class="intro"><div><span class="eyebrow">SMALL COMMITS. BIG DISCOVERIES.</span><h1>枝の先に、まだ知らない世界。</h1></div><p>ひとつのノードから、次の発見へ。<br>気になるタイトルを選んで、Gitの世界をたどろう。</p></section><main class="workspace"><section class="graph-panel" aria-label="6つの発見の目次"><div class="panel-top"><strong>explore / discoveries</strong><span>6 NODES · 3 PATHS</span></div><div class="graph"><svg class="lines" viewBox="0 0 140 524" aria-hidden="true"><path class="rail on" id="rail-world" d="M64 52 L64 462" stroke="#9de6bd"/><path class="rail" id="rail-products" d="M64 134 C64 175 109 175 109 216 L109 298 C109 340 64 340 64 380" stroke="#8cbbff"/><path class="rail" id="rail-space" d="M64 380 L64 462" stroke="#f5b483"/></svg><ol class="nodes" id="nodes"></ol></div><p class="graph-note">この枝はテーマをたどるための目次です。<br>実際のコミット履歴を表しているわけではありません。</p></section><article class="detail" id="detail" tabindex="-1" aria-labelledby="fact-title"><div class="detail-meta"><span class="pill" id="category"></span><span class="sequence" id="sequence"></span></div><h2 id="fact-title"></h2><div class="visual" id="visual"></div><p class="copy" id="copy"></p><p class="qualifier" id="qualifier"></p><div class="detail-footer"><button class="step" id="prev">← 前の発見</button><button class="motion" id="motion" aria-pressed="false">動きをオフ</button><button class="step" id="next">次の発見 →</button></div></article></main><script>
'use strict';
const facts=[
{title:'世界の開発と、つながる道具。',short:'世界の開発者とGit',category:'WORLD / 2022',branch:'world',metric:'96.65%',label:'プロ開発者の調査回答者がGitを利用',text:'2022年のStack Overflow調査で、プロの開発者として回答した人の96.65%がGitを利用していました。いま学び始める道具は、世界の開発現場でも広く使われています。',note:'世界の全開発者を数えた割合ではなく、この調査のプロ回答者の割合です。',icon:'globe'},
{title:'日本からも、大きなコミュニティ。',short:'日本の開発者コミュニティ',category:'WORLD / 2025',branch:'world',metric:'450万+',label:'日本のGitHub開発者コミュニティ',text:'2025年版の発表では、日本のGitHub開発者コミュニティは450万人を超え、国・地域別で世界6位。世界の開発は、遠くの国だけの話ではありません。',note:'2025年版の集計です。世界の全プログラマー人口の順位ではありません。',icon:'globe'},
{title:'いつものスマホの、その裏側。',short:'AndroidとGit・Repo',category:'PRODUCTS / ANDROID',branch:'products',metric:'Git +',label:'Repoで複数のリポジトリを扱う',text:'Androidのオープンソース開発ではGitとRepoが使われています。Repoは複数のGitリポジトリをまとめて扱うための道具。大きな製品では、いくつものリポジトリが協力して動きます。',note:'Android Open Source Projectのソース管理の話です。',icon:'code'},
{title:'コードを書く道具も、公開開発。',short:'VS Codeの開発現場',category:'PRODUCTS / EDITOR',branch:'products',metric:'Code',label:'Code - OSSをコミュニティと開発',text:'VS Codeの基盤となるCode - OSSは、MicrosoftのGitHubリポジトリでコミュニティと公開開発されています。ソースやIssueから、いつものエディターが育つ過程をのぞけます。',note:'配布版VS Codeやすべての拡張機能まで同じライセンスという意味ではありません。',icon:'code'},
{title:'小さな原型から、大きな歴史へ。',short:'Gitの始まり',category:'HISTORY / 2005',branch:'world',metric:'約10日',label:'Gitの初期コアが生まれるまで',text:'2005年、Linuxの開発を支えるため、Linus TorvaldsがGitの初期コアを制作しました。本人の振り返りによると、その原型にかけた時間は約10日でした。',note:'現在のGitの全機能が10日で完成した、という意味ではありません。',icon:'branch'},
{title:'あなたの貢献が、火星へ届くかも。',short:'IngenuityとOSS',category:'SPACE / 2021',branch:'space',metric:'約1.2万',label:'利用されたOSSに貢献した開発者',text:'火星ヘリコプターIngenuityが利用したオープンソースソフトウェアには、約1万2,000人の開発者が貢献していました。ひとつの変更が、思いがけない場所で役立つことがあります。',note:'利用されたOSSへの貢献者です。NASAが直接雇用した開発者数ではありません。',icon:'mars'}];
const drawings={globe:'<circle cx="70" cy="70" r="48"/><ellipse cx="70" cy="70" rx="22" ry="48"/><path d="M25 52h90M25 88h90M70 22v96"/><circle cx="104" cy="46" r="7" fill="#9de6bd"/>',code:'<rect x="17" y="30" width="108" height="80" rx="10"/><path d="M17 48h108M48 65L34 78l14 13M91 65l14 13-14 13M77 60L65 98"/><circle cx="28" cy="39" r="2" fill="#9de6bd"/>',branch:'<path d="M44 35v78M44 90c0-45 60-12 60-55"/><circle cx="44" cy="31" r="9" fill="#101825"/><circle cx="104" cy="31" r="9" fill="#101825"/><circle cx="44" cy="113" r="9" fill="#101825"/>',mars:'<circle cx="70" cy="82" r="39" fill="#42302d"/><path d="M37 87c20-20 45 23 62-9M49 58l12 8M87 102l9 4M45 25h52M70 20v17M60 37h20l7 13H53zM58 50l-8 9M82 50l8 9"/>'};
let current=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)');let motionOff=reduced.matches;
const nodes=document.querySelector('#nodes');facts.forEach((f,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.className='node';b.dataset.branch=f.branch;b.innerHTML=`<span class="dot" aria-hidden="true"></span><span><span class="node-meta">DISCOVERY ${String(i+1).padStart(2,'0')}</span><span class="node-title">${f.short}</span></span><span class="node-tag">↗</span>`;b.addEventListener('click',()=>select(i));li.append(b);nodes.append(li)});
function select(i){current=i;const f=facts[i];document.querySelectorAll('.node').forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));document.querySelector('#category').textContent=f.category;document.querySelector('#sequence').textContent=`${String(i+1).padStart(2,'0')} / 06`;document.querySelector('#fact-title').textContent=f.title;document.querySelector('#copy').textContent=f.text;document.querySelector('#qualifier').textContent=f.note;document.querySelector('#visual').innerHTML=`<svg viewBox="0 0 140 140" aria-hidden="true" fill="none" stroke="#9de6bd" stroke-width="2">${drawings[f.icon]}</svg><div><div class="metric">${f.metric}</div><div class="metric-label">${f.label}</div></div>`;document.querySelectorAll('.rail').forEach(r=>r.classList.toggle('on',r.id==='rail-'+f.branch));document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===5;const d=document.querySelector('#detail');d.classList.remove('animate');if(!motionOff){void d.offsetWidth;d.classList.add('animate')}}
function setMotion(){document.body.classList.toggle('motion-off',motionOff);const b=document.querySelector('#motion');b.setAttribute('aria-pressed',String(motionOff));b.textContent=motionOff?'動きをオン':'動きをオフ'}
document.querySelector('#prev').addEventListener('click',()=>select(Math.max(0,current-1)));document.querySelector('#next').addEventListener('click',()=>select(Math.min(5,current+1)));document.querySelector('#motion').addEventListener('click',()=>{motionOff=!motionOff;setMotion()});reduced.addEventListener('change',e=>{motionOff=e.matches;setMotion()});setMotion();select(0);
</script></body></html>
